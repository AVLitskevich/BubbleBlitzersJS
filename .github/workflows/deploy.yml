name: Deploy BubbleBlitzers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - RariAden-Hub
          - skillcade-alpha

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment target
        run: echo "Deploying to environment ${{ inputs.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Set game server URL
        run: echo '{"gameServerUrl":"${{ vars.GAME_SERVER_URL }}"}' > public/game-config.json

      - name: Build client
        run: npm run build:client

      - name: Build replay viewer
        run: npm run build:replay

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "."
          target: "${{ vars.SERVER_DEPLOY_PATH }}"
          rm: true
          exclude: "node_modules,.git"

      - name: Deploy server and client
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            echo "SERVER_PORT=${{ vars.SERVER_PORT }}" > ${{ vars.SERVER_DEPLOY_PATH }}/.env
            echo "REPLAYS_HOST_PATH=${{ vars.REPLAYS_HOST_PATH }}" >> ${{ vars.SERVER_DEPLOY_PATH }}/.env
            
            # Deploy Main Client
            mkdir -p ${{ vars.CLIENT_DEPLOY_PATH }}
            rm -rf ${{ vars.CLIENT_DEPLOY_PATH }}/*
            cp -r ${{ vars.SERVER_DEPLOY_PATH }}/dist/client/. ${{ vars.CLIENT_DEPLOY_PATH }}/
            
            # Deploy Replay Viewer
            mkdir -p ${{ vars.REPLAY_DEPLOY_PATH }}
            rm -rf ${{ vars.REPLAY_DEPLOY_PATH }}/*
            cp -r ${{ vars.SERVER_DEPLOY_PATH }}/dist/replay-viewer/. ${{ vars.REPLAY_DEPLOY_PATH }}/
            
            cd ${{ vars.SERVER_DEPLOY_PATH }}
            docker compose up -d --build --force-recreate
