name: Deploy BubbleBlitzers

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options:
          - RariAden-Hub
          - skillcade-alpha

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment target
        run: echo "Deploying to environment ${{ inputs.environment }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Set game server URL
        run: echo '{"gameServerUrl":"${{ vars.GAME_SERVER_URL }}"}' > public/game-config.json

      - name: Build client
        run: npm run build:client

      - name: Build replay viewer
        run: npm run build:replay

      - name: Prepare server deploy directory
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH }}"
            if [ -f "$DEPLOY_PATH/docker-compose.yml" ]; then
              cd "$DEPLOY_PATH"
              sudo docker compose down --remove-orphans || true
            fi
            sudo rm -rf "$DEPLOY_PATH"
            sudo mkdir -p "$DEPLOY_PATH"
            sudo chown "$(whoami):$(whoami)" "$DEPLOY_PATH"

      - name: Copy project to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          source: "."
          target: "${{ vars.SERVER_DEPLOY_PATH }}"
          rm: false
          exclude: "node_modules,.git"

      - name: Deploy server and client
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          password: ${{ secrets.REMOTE_PASSWORD }}
          script: |
            set -e
            DEPLOY_PATH="${{ vars.SERVER_DEPLOY_PATH }}"
            CLIENT_PATH="${{ vars.CLIENT_DEPLOY_PATH }}"
            REPLAY_PATH="${{ vars.REPLAY_DEPLOY_PATH }}"

            echo "SERVER_PORT=${{ vars.SERVER_PORT }}" > "$DEPLOY_PATH/.env"
            echo "REPLAYS_HOST_PATH=${{ vars.REPLAYS_HOST_PATH }}" >> "$DEPLOY_PATH/.env"

            sudo mkdir -p "$CLIENT_PATH" "$REPLAY_PATH" "${{ vars.REPLAYS_HOST_PATH }}"
            sudo rm -rf "$CLIENT_PATH"/* "$REPLAY_PATH"/*
            sudo cp -r "$DEPLOY_PATH/dist/client/." "$CLIENT_PATH/"
            sudo cp -r "$DEPLOY_PATH/dist/replay-viewer/." "$REPLAY_PATH/"

            cd "$DEPLOY_PATH"
            sudo docker compose up -d --build --force-recreate
